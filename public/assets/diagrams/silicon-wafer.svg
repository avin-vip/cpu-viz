<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Silicon wafer with die grid pattern">
  <defs>
    <radialGradient id="wafer-shine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="55%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <pattern id="die-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.35"/>
      <rect x="2" y="2" width="20" height="20" fill="#cbd5e1" opacity="0.25"/>
    </pattern>
    <clipPath id="wafer-clip">
      <circle cx="160" cy="160" r="140"/>
    </clipPath>
  </defs>
  <circle cx="160" cy="160" r="148" fill="#0f172a" opacity="0.15"/>
  <circle cx="160" cy="160" r="140" fill="url(#wafer-shine)" stroke="#334155" stroke-width="3"/>
  <g clip-path="url(#wafer-clip)">
    <rect x="20" y="20" width="280" height="280" fill="url(#die-grid)"/>
    <circle cx="160" cy="160" r="95" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.4"/>
    <circle cx="160" cy="160" r="55" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.25"/>
  </g>
  <circle cx="160" cy="160" r="6" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
  <text x="160" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#334155">300mm Silicon Wafer</text>
</svg>
